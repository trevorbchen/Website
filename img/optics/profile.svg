<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="IBM Plex Mono, monospace" font-size="13"><rect width="720" height="300" fill="#fbf9f3"/><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="11" refX="11" refY="5.5" orient="auto"><path d="M0,0 L12,5.5 L0,11 z" fill="#ffe03a" stroke="#111015" stroke-width="1.5"/></marker><marker id="b" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="11" refX="11" refY="5.5" orient="auto"><path d="M0,0 L12,5.5 L0,11 z" fill="#ff2e88" stroke="#111015" stroke-width="1.5"/></marker></defs><path d="M 60 230 L 160 196 L 160 230 L 260 196 L 260 230 L 360 196 L 360 230 L 460 196 L 460 230 L 560 196 L 560 230 L 660 196 L 660 230 L 660 270 L 60 270 Z" fill="#111015" stroke="#111015" stroke-width="3"/><line x1="322" y1="84" x2="268" y2="212" stroke="#ffe03a" stroke-width="5" marker-end="url(#a)"/><line x1="268" y1="212" x2="326" y2="80" stroke="#ff2e88" stroke-width="5" stroke-dasharray="9 7" marker-end="url(#b)"/><text x="350" y="100" fill="#111015" font-weight="700">in, and back out along itself (Littrow)</text><path d="M 190 230 A 40 40 0 0 1 226 215" fill="none" stroke="#ff2e88" stroke-width="3"/><text x="226" y="248" fill="#ff2e88" font-weight="700" font-size="15">blaze angle</text><line x1="260" y1="262" x2="360" y2="262" stroke="#fbf9f3" stroke-width="3"/><text x="310" y="282" text-anchor="middle" fill="#111015" font-weight="700">period d</text><text x="30" y="26" fill="#111015" font-weight="700" font-size="15">a blazed groove profile (cross-section)</text><text x="30" y="46" fill="#55525e">tilt the facet so the mirror reflection and the diffracted order are the same direction</text></svg>