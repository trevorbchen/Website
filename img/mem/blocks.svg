<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="IBM Plex Mono, monospace" font-size="13"><rect width="760" height="300" fill="#fbf9f3"/><text x="380" y="26" text-anchor="middle" font-weight="700" fill="#111015" font-size="15">feature-correlation spectrum (schematic)</text><rect x="30" y="65" width="150" height="170" fill="#ff2e88" stroke="#111015" stroke-width="3"/><text x="105.0" y="58" text-anchor="middle" font-weight="700" fill="#111015">signal modes</text><text x="105.0" y="258" text-anchor="middle" fill="#55525e">shared by all samples</text><rect x="200" y="140" width="200" height="95" fill="#ffe03a" stroke="#111015" stroke-width="3"/><text x="300.0" y="133" text-anchor="middle" font-weight="700" fill="#111015">noise-dimension bulk</text><text x="300.0" y="258" text-anchor="middle" fill="#55525e">extra latent dims land here</text><rect x="410" y="165" width="190" height="70" fill="#19d3e6" stroke="#111015" stroke-width="3"/><text x="505.0" y="158" text-anchor="middle" font-weight="700" fill="#111015">sample-specific modes</text><text x="505.0" y="258" text-anchor="middle" fill="#55525e">memorization needs these</text><rect x="610" y="213" width="120" height="22" fill="#cfcfd6" stroke="#111015" stroke-width="3"/><text x="670.0" y="206" text-anchor="middle" font-weight="700" fill="#111015">residual floor</text><line x1="30" y1="236" x2="730" y2="236" stroke="#111015" stroke-width="3"/><line x1="150" y1="280" x2="650" y2="280" stroke="#111015" stroke-width="3" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#111015"/></marker></defs><text x="150" y="296" fill="#111015">learned first (large eigenvalue)</text><text x="650" y="296" text-anchor="end" fill="#111015">learned last (small eigenvalue)</text></svg>